name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: fly-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Check token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Create Fly app if it doesn't exist yet
        run: flyctl status >/dev/null 2>&1 || flyctl apps create "$(grep -m1 '^app' fly.toml | cut -d'"' -f2)"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
